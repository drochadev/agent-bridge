[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-mediator"
version = "0.1.0"
description = "Public, generalized one-shot delivery between two independent agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["core*", "adapters*"]
