[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-mediator"
version = "0.1.0"
description = "Local controlled bridge between ChatGPT and OpenCode agents (one-shot mediated delivery)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["core*", "adapters*"]
