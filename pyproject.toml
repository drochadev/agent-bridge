[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bridge"
version = "0.1.0"
description = "Give ChatGPT hands-on access to your local codebase: a controlled bridge between ChatGPT Web and OpenCode"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["core*", "adapters*"]
